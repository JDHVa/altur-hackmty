services:
  altur:
    build:
      context: ..
      dockerfile: vultr/Dockerfile
    ports:
      - "80:80"
    volumes:
      - hfcache:/app/.hfcache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hfcache:
